<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master editável da página institucional Sharebook Originals.
  O logo vem do asset canônico do frontend; não duplicar a marca neste pacote.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1280" viewBox="0 0 1024 1280">
  <image x="0" y="0" width="1024" height="1280" preserveAspectRatio="none" xlink:href="sharebook-originals-page-02-background-v1.png"/>
  <rect x="68" y="68" width="326" height="154" rx="20" fill="#fffdf8" opacity="0.96"/>
  <image x="92" y="92" width="274" height="106" preserveAspectRatio="xMinYMid meet" xlink:href="../../../../../sharebook-frontend/src/assets/img/logo.png"/>

  <g fill="#102f55">
    <text x="96" y="344" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" letter-spacing="4.2">SHAREBOOK ORIGINALS</text>
    <rect x="96" y="376" width="74" height="3" rx="1.5" fill="#29abe2"/>
    <text x="96" y="470" font-family="DejaVu Serif, serif" font-size="52" font-weight="400">Livros que nascem</text>
    <text x="96" y="530" font-family="DejaVu Serif, serif" font-size="52" font-weight="400">aqui para circular.</text>
  </g>

  <text x="96" y="626" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#31445c">Obras autorais, gratuitas e feitas</text>
  <text x="96" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#31445c">para encontrar novos leitores.</text>

  <g fill="#1c4e79">
    <text x="96" y="1122" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2">SHAREBOOK.COM.BR</text>
    <text x="96" y="1154" font-family="DejaVu Sans, sans-serif" font-size="15" letter-spacing="2.1">COMPARTILHANDO CONHECIMENTO</text>
  </g>
</svg>
